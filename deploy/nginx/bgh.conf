# nginx reverse proxy for Better GitHub (bgh listening on 127.0.0.1:3000).
#
#   install -m 0644 deploy/nginx/bgh.conf /etc/nginx/conf.d/bgh.conf
#   # replace git.example.com and the certificate paths, then:
#   nginx -t && systemctl reload nginx
#
# Set BGH_BASE_URL=https://git.example.com and BGH_LISTEN=127.0.0.1:3000.
# Needs nginx >= 1.25.1 (for `http2 on;`); on older versions use
# `listen 443 ssl http2;` instead.

upstream bgh {
    server 127.0.0.1:3000;
    keepalive 32;
}

# WebSocket upgrade for the sync channel; plain keep-alive otherwise.
map $http_upgrade $bgh_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name git.example.com;
    # ACME http-01 challenges, if certbot/acme.sh uses the webroot method.
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name git.example.com;

    ssl_certificate     /etc/letsencrypt/live/git.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/git.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:bgh_tls:10m;

    # Git pushes, LFS objects and release assets can be arbitrarily large;
    # bgh enforces its own limits.
    client_max_body_size 0;

    # bgh compresses responses itself (and serves pre-compressed assets).
    gzip off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Local-first sync WebSocket. Note: proxy_set_header in a location
    # replaces (does not extend) the server-level list, so repeat it.
    location = /_bgh/sync/ws {
        proxy_pass http://bgh;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $bgh_connection;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Git smart HTTP and LFS: stream request and response bodies (packs can
    # be gigabytes; buffering them to disk stalls clones and pushes).
    location ~ ^/[^/]+/[^/]+?(\.git)?/(info/refs|git-upload-pack|git-receive-pack|info/lfs/) {
        proxy_pass http://bgh;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # REST API, GraphQL, web client, raw files, archives.
    location / {
        proxy_pass http://bgh;
    }
}

# Optional: expose git-over-SSH on port 22 through nginx's stream module
# (put this at the top level of nginx.conf, outside `http {}`, and set
# BGH_SSH_PORT=22 so clone URLs match). Alternatively publish bgh's
# BGH_SSH_PORT (2222) directly in the firewall.
#
# stream {
#     server {
#         listen 22;
#         proxy_pass 127.0.0.1:2222;
#         proxy_timeout 1h;
#     }
# }
