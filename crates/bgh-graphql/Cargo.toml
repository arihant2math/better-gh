[package]
name = "bgh-graphql"
description = "GitHub GraphQL v4 compatible subset"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bgh-core.workspace = true
bgh-git.workspace = true
bgh-issues.workspace = true
bgh-projects.workspace = true
bgh-pulls.workspace = true
bgh-repos.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tracing.workspace = true
anyhow.workspace = true
tokio.workspace = true
chrono.workspace = true
base64.workspace = true
futures.workspace = true
async-graphql = { version = "7.0", default-features = false, features = ["dataloader"] }

[dev-dependencies]
bgh-core = { workspace = true, features = ["testing"] }
bgh-server = { workspace = true, features = ["testing"] }
tokio.workspace = true
