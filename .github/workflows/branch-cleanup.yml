name: Branch cleanup

# Deletes a PR's head branch once it is merged, and periodically deletes any
# branch that is fully merged into main. Agents can't delete branches they
# didn't create, so cleanup lives here.
on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete the merged PR's head branch
        if: github.event_name == 'pull_request' && github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$HEAD_REF" != "main" ]; then
            git push origin --delete "$HEAD_REF" || echo "already gone: $HEAD_REF"
          fi
      - name: Delete branches fully merged into main
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --prune origin
          main_tip=$(git rev-parse origin/main)
          cutoff=$(( $(date +%s) - 48*3600 ))
          # Branches with an open PR are never touched.
          open_heads=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 500 \
            --json headRefName --jq '.[].headRefName')
          for b in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin); do
            case "$b" in HEAD|main) continue ;; esac
            if printf '%s\n' "$open_heads" | grep -qxF "$b"; then
              echo "skip (open PR): $b"; continue
            fi
            tip=$(git rev-parse "origin/$b")
            # A branch pointing at main's tip was probably just created and
            # has no commits yet; recent tips may belong to work in progress.
            if [ "$tip" = "$main_tip" ]; then
              echo "skip (at main tip): $b"; continue
            fi
            if [ "$(git log -1 --format=%ct "$tip")" -gt "$cutoff" ]; then
              echo "skip (tip < 48h old): $b"; continue
            fi
            if git merge-base --is-ancestor "$tip" origin/main; then
              echo "deleting $b"
              git push origin --delete "$b" || echo "failed: $b"
            fi
          done
