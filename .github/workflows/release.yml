name: Release

# Builds the `bgh` binary with the web client embedded (`embed-web`) for
# Linux (x86_64) and macOS (Apple silicon). Pushing a `v*` tag also publishes
# the archives to a GitHub release; manual runs and PRs that touch this file
# only upload them as workflow artifacts. See docs/SELF_HOSTING.md.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  web:
    name: Web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: release-web-dist
          path: web/dist
          include-hidden-files: true
          retention-days: 1

  build:
    name: bgh (${{ matrix.target }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      # Link OpenSSL (webauthn-rs) statically so the binary does not depend
      # on the build host's libssl (Homebrew's on macOS).
      OPENSSL_STATIC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      - name: Point openssl-sys at Homebrew OpenSSL
        if: runner.os == 'macOS'
        run: echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - run: >-
          cargo build --release --locked -p bgh-server --bin bgh
          --features embed-web --target ${{ matrix.target }}
      - name: Package
        id: package
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          TARGET: ${{ matrix.target }}
        run: |
          bin="target/$TARGET/release/bgh"
          "$bin" --version
          if [ "$REF_TYPE" = tag ]; then version="$REF_NAME"; else version="${GITHUB_SHA::7}"; fi
          name="bgh-$version-$TARGET"
          mkdir -p "dist/$name"
          cp "$bin" README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bgh-*
          path: dist
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes --verify-tag
          fi
