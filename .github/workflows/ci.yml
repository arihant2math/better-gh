# Path-filtered CI. The `changes` job classifies a pull request's diff
# (scripts/ci-changes.sh) and the heavy jobs carry a job-level `if:`, so a
# job that isn't needed reports "skipped". Pushes to main and
# workflow_dispatch always run everything. Because a failed `changes` job
# would also mark every gated job skipped, `CI result` aggregates them and
# fails on any failure/cancel: make that the required status check.
#
# Dependency rules (keep in sync with scripts/ci-changes.sh and
# docs/AGENT_WORKFLOW.md "CI is the shared gate"):
# * backend (rust-lint, rust-test, which also runs the gh compat report):
#   crates/, migrations/, scripts/,
#   Cargo.*, rust toolchain/fmt/clippy/nextest config.
# * frontend (web): web/.
# * both: testdata/ (the markdown golden corpus is read by Rust tests and by
#   web/src/ui/markdown/render.golden.test.ts) and
#   web/src/ui/markdown/emoji.json (bgh-core include_str!s it). Otherwise the
#   web job needs no server (vitest only; the viewport matrix isn't in CI).
# * docker: Dockerfile, .dockerignore or Cargo.lock only. On PRs the image
#   compiles bgh itself (~28 min release build), so other backend/frontend
#   changes skip it. Off pull requests (main, workflow_dispatch) it packages
#   the release-binary artifact instead, so release + thin LTO compiles once
#   per push and the image holds the exact uploaded binary (#85).
# * release-binary embeds web/dist too; it only runs off pull requests, where
#   everything runs.
# * .github/workflows/ and scripts/ci-changes.sh run everything. Docs-only
#   changes run only the cheap `scripts` job.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      # On pull_request the checkout is the test merge commit, whose first
      # parent is the base branch tip: HEAD^1..HEAD is exactly the PR's diff.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ] && git rev-parse -q --verify HEAD^1 >/dev/null; then
            git diff --name-only HEAD^1 HEAD | tee /dev/stderr | ./scripts/ci-changes.sh >> "$GITHUB_OUTPUT"
          else
            ./scripts/ci-changes.sh --all >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # Lint on every platform we ship or develop on, so platform-specific code
  # (cfg gates, Linux-only APIs) can't break other targets unnoticed. Tests
  # stay Linux x86_64 only (rust-test).
  rust-lint:
    name: Rust (fmt, clippy, ${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux-x86_64 restores rust-test's cache, which main also warms
          # with clippy's check-mode deps: one x86_64 entry instead of two,
          # while clippy still runs beside the tests, not in front of them.
          - { name: linux-x86_64, os: ubuntu-latest, cache: x86_64-debug }
          - { name: linux-arm64, os: ubuntu-24.04-arm, cache: clippy-linux-arm64 }
          - { name: macos-arm64, os: macos-latest, cache: clippy-macos-arm64 }
    runs-on: ${{ matrix.os }}
    # Must match rust-test's: rust-cache hashes CARGO_* env into the key, and
    # linux-x86_64 restores rust-test's entry. Check mode ignores it anyway.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      # openssl-sys (via webauthn-rs) links the system OpenSSL.
      - name: Install native deps (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! pkg-config --exists openssl; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends pkg-config libssl-dev
          fi
      - name: Install native deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # rust-cache already keys on OS and arch; the name keeps it explicit.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache }}
          # Only main writes caches; PRs restore main's (#85). rust-test is
          # the only writer of the shared x86_64-debug entry.
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.cache != 'x86_64-debug' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-test:
    name: Rust (tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bgh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost/bgh
      REDIS_URL: redis://127.0.0.1/
      # CI only (#85): no DWARF for workspace crates either (deps already have
      # none), so a smaller target dir and cache and faster test-binary links.
      # Backtraces keep function names (symbol table) and panic messages keep
      # file:line; only per-frame file:line goes. Mirrored in rust-lint so the
      # shared x86_64-debug cache key matches. Not set for release builds.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Only main writes caches; PRs restore main's. Tests are often red, so
      # save on failure too, or the cache never warms (#85). The key has no
      # ref in it, so a PR run hits the entry its base main run saved. The
      # linux-x86_64 clippy job restores this entry too (see the last step).
      - id: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86_64-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # Integration tests drive the real git CLI (preinstalled, with git-lfs).
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      # The suite's expected constraint violations and per-test DROP DATABASE
      # make Postgres log tens of thousands of lines, which the runner dumps
      # after the job and which bury the test output in the log tail.
      - name: Quiet the Postgres service log
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U postgres
          -c "ALTER SYSTEM SET log_min_messages = 'panic'"
          -c "ALTER SYSTEM SET log_min_error_statement = 'panic'"
          -c "ALTER SYSTEM SET log_checkpoints = off"
          -c "SELECT pg_reload_conf()"
      # Prebuilt binary, never `cargo install`. Profile: .config/nextest.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # Compile separately so the job timings split build from run time.
      - id: build
        run: cargo nextest run --workspace --locked --no-run 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"
        shell: bash
      - run: cargo nextest run --workspace --locked --profile ci --no-fail-fast 2>&1 | tee -a "$RUNNER_TEMP/cargo-test.log"
        shell: bash # -o pipefail: keep cargo's exit status through tee
      # nextest doesn't run doctests.
      - run: cargo test --doc --workspace --locked 2>&1 | tee -a "$RUNNER_TEMP/cargo-test.log"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
      - name: Summarize test failures
        if: failure()
        run: |
          {
            echo '### Rust test failures'
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/cargo-test.log" \
              | grep -E '^ *(FAIL|TIMEOUT|SIGSEGV|SIGABRT|ABORT|LEAK-FAIL) \[|^test .* FAILED$|panicked at|^error(\[|:)|test result: FAILED' \
              | awk '!seen[$0]++' || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # Real gh CLI + REST smoke against a throwaway server, run here on the
      # bgh binary the build step already linked for bgh-server's integration
      # tests instead of on a separate, cold runner (#85). Informational until
      # the domain packages land: it runs whether or not tests passed, and its
      # failures are reported, not fatal (add --strict to gate on it).
      # psql (creates the throwaway database), git, gh, jq and python3 are
      # preinstalled on ubuntu-latest.
      - name: gh compatibility (report)
        id: compat
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        env:
          # gh is preinstalled on GitHub-hosted runners; keep it away from the
          # workflow's own GitHub token.
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        shell: bash
        run: |
          BGH_BIN="$PWD/target/debug/bgh"
          [ -x "$BGH_BIN" ] || cargo build --locked -p bgh-server --bin bgh
          export BGH_BIN
          rc=0
          ./scripts/api-smoke.sh --json api-smoke.json || rc=$?
          # Port 443 needs root; the harness falls back to a high port (gh pr
          # checkout and other remote-matching commands then can't match hosts).
          ./scripts/gh-compat.sh --json gh-compat.json || rc=$?
          exit "$rc"
      - name: Summarize gh compatibility
        if: ${{ !cancelled() && steps.compat.outcome != 'skipped' && hashFiles('gh-compat.json') != '' }}
        continue-on-error: true
        run: |
          {
            echo "## gh compatibility"
            jq -r '"\(.summary.pass) passed, \(.summary.fail) failed, \(.summary.skip) skipped of \(.summary.total)"' gh-compat.json
            echo
            echo "| Result | Command | Detail |"
            echo "|---|---|---|"
            jq -r '.results[] | select(.kind == "gh") | "| \(.status) | `\(.name)` | \(.detail | gsub("\\|"; "\\\\|")) |"' gh-compat.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() && steps.compat.outcome != 'skipped' }}
        continue-on-error: true
        with:
          name: compat-results
          if-no-files-found: ignore
          path: |
            gh-compat.json
            api-smoke.json
      # Main only, and only on a cache miss (an exact hit isn't re-saved, so
      # the work would be thrown away): check the deps in clippy's mode too,
      # so the saved x86_64-debug entry warms the linux-x86_64 clippy job
      # (#85). Lint results come from rust-lint; this step only fills the cache.
      - name: Warm clippy deps for the shared cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked

  web:
    name: Web (typecheck, lint, test, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Includes the bundle budget check (scripts/size-check.mjs).
      - run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  # Single binary with the web client embedded, built in release mode.
  release-binary:
    name: Release binary (embed-web)
    needs: web
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: web/dist
      - run: cargo build --release --locked -p bgh-server --bin bgh --features embed-web
      - run: ./target/release/bgh --version
      - uses: actions/upload-artifact@v6
        with:
          name: bgh-linux-x86_64
          path: target/release/bgh
          retention-days: 14

  # Off pull requests the image packages release-binary's artifact through
  # the Dockerfile's `bin` build context (no Rust build here). On PRs, where
  # release-binary doesn't run, it compiles from source, then also rebuilds
  # from the binary it extracted so the prebuilt path is covered too.
  docker:
    name: Docker image
    needs: [changes, release-binary]
    if: >-
      !cancelled() && needs.changes.outputs.docker == 'true'
      && (github.event_name == 'pull_request' || needs.release-binary.result == 'success')
    runs-on: ubuntu-latest
    env:
      PREBUILT: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: actions/download-artifact@v7
        if: env.PREBUILT == 'true'
        with:
          name: bgh-linux-x86_64
          path: ${{ runner.temp }}/bgh-bin
      - name: Build from source
        if: env.PREBUILT != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: bgh:source
          # One named scope; only main writes it, PRs restore it read-only so
          # they don't add multi-GB entries that evict main's cargo caches.
          cache-from: type=gha,scope=bgh
      - name: Extract the binary from the source-built image
        if: env.PREBUILT != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bgh-bin"
          id=$(docker create bgh:source)
          docker cp "$id:/usr/local/bin/bgh" "$RUNNER_TEMP/bgh-bin/bgh"
          docker rm "$id"
      - name: Build from the prebuilt binary
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: bin=${{ runner.temp }}/bgh-bin
          push: false
          load: true
          tags: bgh:ci
          # On main this caches the runtime stage's apt layer (#85).
          cache-from: type=gha,scope=bgh
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=bgh,mode=max' || '' }}
      - name: Smoke-test the image
        env:
          BIN: ${{ runner.temp }}/bgh-bin/bgh
        run: |
          docker run --rm bgh:ci --version
          docker run --rm --entrypoint git bgh:ci --version
          # The image must carry exactly the binary it was built from.
          id=$(docker create bgh:ci)
          docker cp "$id:/usr/local/bin/bgh" "$RUNNER_TEMP/bgh-image"
          docker rm "$id"
          cmp "$BIN" "$RUNNER_TEMP/bgh-image"

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 2: the migration check diffs the PR merge commit
      # against its first parent (the base branch tip).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - run: shellcheck -x -S warning scripts/dev.sh scripts/gh-compat.sh scripts/api-smoke.sh scripts/check-test-layout.sh scripts/check-migrations.sh scripts/ci-changes.sh scripts/lib/*.sh
      # One integration-test binary per crate (tests/it/main.rs).
      - run: ./scripts/check-test-layout.sh
      # New migrations sort after main's; merged ones are immutable (#220).
      - if: github.event_name == 'pull_request'
        run: ./scripts/check-migrations.sh HEAD^1
      - run: python3 -c 'import ast,sys; ast.parse(open(sys.argv[1]).read())' scripts/lib/tls-proxy.py

  # Single required check. Gated jobs that weren't needed are "skipped" (ok);
  # a failed or cancelled job, including `changes` itself, fails this. The
  # informational compat report (a continue-on-error step in rust-test) can't
  # fail it.
  ci-result:
    name: CI result
    if: always()
    needs: [changes, rust-lint, rust-test, web, release-binary, docker, scripts]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *) echo "::error::a required job finished with '$r'"; exit 1 ;;
            esac
          done
